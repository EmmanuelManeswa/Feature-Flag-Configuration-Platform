name: feature-flag-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feature_flags}
      POSTGRES_USER: ${POSTGRES_USER:-feature_flags}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      # Host-side port only. Defaults to 5433 (not 5432) to avoid clashing with
      # a Postgres instance already running natively on the host. Containers
      # talking to this service over the compose network always use 5432
      # internally, regardless of this mapping.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume, not a bind mount: survives `docker compose down` and
      # container recreation. Only `docker compose down -v` removes it.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feature_flags} -d ${POSTGRES_DB:-feature_flags}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Same reasoning as postgres above: 6380 by default to dodge a
      # natively-running Redis on the host.
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Container-to-container addresses — always the compose service name and
      # the *internal* port, regardless of what POSTGRES_PORT/REDIS_PORT are
      # set to for host-side access above.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-feature_flags}
      POSTGRES_USER: ${POSTGRES_USER:-feature_flags}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CACHE_FLAG_TTL_SECONDS: ${CACHE_FLAG_TTL_SECONDS:-300}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      # host.docker.internal: Docker Desktop's DNS name for reaching services
      # running on the host machine (where Docker Model Runner listens) from
      # inside a container — "localhost" here would mean the container itself.
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:12434/engines/v1}
      AI_MODEL: ${AI_MODEL:-ai/llama3.2}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Consumed by the browser, not this container — must point at the
        # backend's *host*-reachable address, not the internal service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
