spring:
  application:
    name: feature-flag-platform
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:feature_flags}
    username: ${POSTGRES_USER:feature_flags}
    # No insecure fallback default: the app must fail to start rather than
    # silently connect with a guessable password. Set via .env locally.
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: feature-flags-pool
  jpa:
    hibernate:
      # Flyway owns schema evolution; Hibernate only ever validates it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short on purpose: the whole point of the cache-aside design (ADR-002)
      # is that a Redis outage degrades to "evaluation runs at Postgres
      # speed", not "evaluation blocks for seconds per request". Verified by
      # smoke-testing with Redis stopped — at Lettuce's 2s default this was
      # ~4s per evaluation (a failed GET, then a failed PUT); at 300ms it's
      # a bounded ~600ms worst case instead.
      timeout: 300ms
      connect-timeout: 300ms
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # No fallback default on purpose: an insecure-but-working default is how
    # a real deployment ends up signing tokens with a secret published in a
    # public repo. Missing JWT_SECRET must fail application startup, not
    # silently start in a broken-security state. Generate one locally with
    # `openssl rand -base64 48` (see .env.example).
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cache:
    flag-ttl-seconds: ${CACHE_FLAG_TTL_SECONDS:300}
  ai:
    # mock | docker-model-runner
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:http://localhost:12434/engines/v1}
    model: ${AI_MODEL:ai/llama3.2:latest}
    # 20s, not 8s: measured directly against a real ai/llama3.2 call on this
    # machine — a *cold* model (just loaded, or reloaded after Docker Model
    # Runner idles it out) took ~14-18s before the first token, even though
    # actual inference (per llama.cpp's own `timings.predicted_ms`) was well
    # under a second once warm. 8s clipped real, successful responses before
    # they finished. Irrelevant to MockAiProvider, which never makes a
    # network call.
    timeout-ms: ${AI_TIMEOUT_MS:20000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.featureflagplatform: DEBUG
